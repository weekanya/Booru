name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Android SDK packages
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37*
          key: android-sdk-platform-37

      - name: Install Android SDK platform 37
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses --channel=3 > /dev/null || true
          "$SDKMANAGER" --list --channel=3 2>/dev/null | grep -o 'platforms;android-[0-9A-Za-z.\-]*' | sort -u | tail -n 15
          PKG="$("$SDKMANAGER" --list --channel=3 2>/dev/null | grep -o 'platforms;android-37[0-9A-Za-z.\-]*' | sort -V | head -1)"
          if [ -z "$PKG" ]; then
            echo "::error::No platforms;android-37* package found in any SDK channel"
            exit 1
          fi
          echo "Installing $PKG"
          yes | "$SDKMANAGER" --install --channel=3 "$PKG" > /dev/null
          DIR="$ANDROID_HOME/platforms/${PKG#platforms;}"
          if [ "$DIR" != "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$DIR" "$ANDROID_HOME/platforms/android-37"
            sed -i "s|path=\"$PKG\"|path=\"platforms;android-37\"|" "$ANDROID_HOME/platforms/android-37/package.xml"
          fi
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: booru-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
