name: Probe
on:
  push:
    branches: [claude/mobile-vibcode-repo-16u3vc]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://dl.google.com/android/maven2/androidx/compose/material3/material3-android
          for v in 01 03 05 07 09 11 13 15 17 19 21 23 25; do
            V=1.5.0-alpha$v
            curl -s -o m.aar $G/$V/material3-android-$V.aar || continue
            META=$(unzip -p m.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null | grep -E 'minCompileSdk=|minAndroidGradle' | tr '\n' ' ')
            KT=$(curl -s $G/$V/material3-android-$V.pom | grep -A1 '<artifactId>kotlin-stdlib</artifactId>' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            FND=$(curl -s $G/$V/material3-android-$V.pom | grep -A1 '<artifactId>foundation-android</artifactId>' | grep -oE '1\.[0-9]+\.[0-9a-z-]+')
            echo "$V | $META| kotlin $KT | foundation $FND"
          done
          echo "== ksp"; curl -s https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml | grep -oE '<version>2\.(1|2)\.[0-9]+-[0-9.]+</version>' | tail -12
          echo "== agp 8"; curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>8\.[0-9]+\.[0-9]+</version>' | tail -4
