name: Android setup
description: Set up JDK 21, Android SDK platform 37 and Gradle with caching

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Install Android SDK platform 37
      shell: bash
      run: |
        set +o pipefail
        SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
        yes | "$SDKMANAGER" --licenses --channel=3 > /dev/null || true
        "$SDKMANAGER" --list --channel=3 2>/dev/null | grep -o 'platforms;android-[0-9A-Za-z.\-]*' | sort -u | tail -n 15
        PKG="$("$SDKMANAGER" --list --channel=3 2>/dev/null | grep -oE 'platforms;android-37\.[0-9]+' | sort -uV | head -1)"
        if [ -z "$PKG" ]; then
          echo "::error::No platforms;android-37* package found in any SDK channel"
          exit 1
        fi
        echo "Installing $PKG"
        yes | "$SDKMANAGER" --install --channel=3 "$PKG" > /dev/null
        DIR="$ANDROID_HOME/platforms/${PKG#platforms;}"
        TARGET="$ANDROID_HOME/platforms/android-37"
        if [ "$DIR" != "$TARGET" ]; then
          rm -rf "$TARGET"
          cp -r "$DIR" "$TARGET"
          sed -i -E \
            -e "s|path=\"$PKG\"|path=\"platforms;android-37\"|" \
            -e 's|<api-level>37\.[0-9]+</api-level>|<api-level>37</api-level>|' \
            -e 's|<minor-api-level>[^<]*</minor-api-level>||' \
            -e 's|<codename>[^<]*</codename>||' \
            "$TARGET/package.xml"
          sed -i -E \
            -e 's|^(AndroidVersion\.ApiLevel)=37\.[0-9]+|\1=37|' \
            -e '/^AndroidVersion\.(MinorApiLevel|CodeName)=/d' \
            -e 's|^(Pkg\.Path)=.*|\1=platforms;android-37|' \
            "$TARGET/source.properties"
          sed -i -E 's|^(ro\.build\.version\.sdk)=.*|\1=37|' "$TARGET/build.prop" || true
        fi
        grep -o '<type-details.*</type-details>' "$TARGET/package.xml" || true
        cat "$TARGET/source.properties"

    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false
